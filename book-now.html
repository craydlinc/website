  <title>Schedule a Meeting | CRAYDL</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .booking-embed { max-width: 900px; margin: 0 auto; padding: 1.5rem; position: relative; }
    iframe.booking-widget { width: 100%; border: none; overflow: hidden; min-height: 700px; position: relative; z-index: 1; }
    .booking-loading {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #666;
      transition: opacity 0.3s ease;
    }
    .booking-loading.is-hidden { opacity: 0; pointer-events: none; }
    .booking-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #ddd;
      border-top-color: #999;
      border-radius: 50%;
      animation: booking-spin 0.8s linear infinite;
    }
    @keyframes booking-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="booking-embed">
    <div class="booking-loading" id="booking-loading">
      <div class="booking-spinner"></div>
      <p>Loading scheduler&hellip;</p>
    </div>
    <iframe class="booking-widget" src="https://api.leadconnectorhq.com/widget/booking/LAbd5bA0XCLXKkogNnar" scrolling="no" id="LAbd5bA0XCLXKkogNnar_booking"></iframe>
  </div>
  <script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
  <script>
    gtag_report_conversion();
    (function () {
      var loader = document.getElementById('booking-loading');
      var hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.classList.add('is-hidden');
      }
      window.addEventListener('message', function (event) {
        if (/leadconnectorhq\.com$|msgsndr\.com$/.test(event.origin.replace(/^https?:\/\//, ''))) {
          hideLoader();
        }
      });
      setTimeout(hideLoader, 6000);
    })();
  </script>
